[project]
name = "nvh-simulator"
version = "0.1.0"
description = "Synthetic gearbox NVH signal generator conforming to the NVH data contract"
requires-python = ">=3.10"
dependencies = [
    "nvh-contract",
    "analysis-engine",
    "numpy>=1.26",
    "pyarrow>=15.0",
]

[project.scripts]
nvh-sim = "nvh_simulator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nvh-design-tokens"
version = "0.1.0"
description = "Canonical design tokens (color, type, layout, signature assets) shared by the NVH web and Qt clients"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvh_design_tokens = ["tokens.json", "assets/*"]

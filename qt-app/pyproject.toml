[project]
name = "nvh-qt-app"
version = "0.1.0"
description = "PySide6 Report GUI desktop client for the NVH EOL test system (Master Entry/Reports + Live Display all wired to nvh-web-backend)"
requires-python = ">=3.10"
dependencies = [
    "nvh-design-tokens",
    "PySide6>=6.8",
]

[project.scripts]
nvh-qt-app = "nvh_qt_app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_classes = ["*Tests"]
